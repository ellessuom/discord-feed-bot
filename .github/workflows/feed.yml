name: Fetch Steam News

on:
  # The Worker cron (worker/src/clock.ts) dispatches this every hour on the hour;
  # GitHub's own schedule fires only every 3-7 h, so it's just a fallback in case
  # the Worker is paused. Offset to :30 so it doesn't collide with a dispatch.
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # DISCORD_BOT_TOKEN must be present here even though this step only posts
      # news: loadConfig() substitutes every ${VAR} in config.yaml up front and
      # throws on any that is unset, which would take the news feed down.
      - name: Run fetch
        run: npm run fetch
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

      # CF_D1_TOKEN is read straight from the environment (not config.yaml) and is optional:
      # without it the forum just skips the "Owned by" fields.
      - name: Scan for game proposals
        run: npm run proposals
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}

      # Sales, Early Access exits and releases (src/alerts/). State lives in D1, so it
      # never commits; it runs even if an earlier step failed, and fails loudly itself.
      # Patch notes are summarized by OpenAI only while the AI_ENABLED repo variable is
      # "true"; without it (or the key) the step just skips them.
      - name: Post game alerts
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: npm run alerts
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_ENABLED: ${{ vars.AI_ENABLED }}

      # The 18:00 digest of alerts over the daily cap and the Monday voice recap
      # (src/wrapup/). D1 only, no AI; each runs once and a missed one catches up.
      - name: Post wrap-ups
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: npm run wrapup
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}

      # always(): a failure in the proposals step must not discard the news state
      # or the scan cursor, or the next run re-posts news and re-scans history.
      - name: Commit state and status
        if: always()
        run: |
          git config user.name "Demousselle"
          git config user.email "39221632+ellessuom@users.noreply.github.com"
          for f in data/state.json data/status.json data/proposals.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "Update feed state [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
