name: Preview wrap-up

# Posts a wrap-up to the private #test channel now, whatever the schedule: daily = the
# last 24 h of alerts over the cap, weekly = the last 7 days of voice. It records
# nothing (the real ones still post when due) and never commits.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Which wrap-up
        type: choice
        options: [weekly, daily]
        default: weekly

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Post the preview to #test
        timeout-minutes: 5
        run: npm run wrapup -- --preview
        env:
          WRAPUP_KIND: ${{ inputs.kind }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
