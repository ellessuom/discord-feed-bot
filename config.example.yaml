discord:
  webhook_url: '${DISCORD_WEBHOOK_URL}'

sources:
  - id: 'steam_730'
    type: 'steam_game'
    name: 'Counter-Strike 2'
    appid: 730
    enabled: true

  # Steam News (platform-wide announcements)
  # - id: 'steam_news'
  #   type: 'steam_news'
  #   name: 'Steam News'
  #   enabled: false

  # Reddit subreddit
  # - id: 'reddit_steam'
  #   type: 'reddit'
  #   name: 'r/Steam'
  #   subreddit: 'Steam'
  #   enabled: false

  # Generic RSS feed
  # - id: 'rss_example'
  #   type: 'rss'
  #   name: 'Example Blog'
  #   url: 'https://example.com/feed.xml'
  #   enabled: false

  # GitHub releases
  # - id: 'github_vercel_nextjs'
  #   type: 'github'
  #   name: 'Next.js'
  #   owner: 'vercel'
  #   repo: 'next.js'
  #   enabled: false

settings:
  max_posts_per_run: 10
  include_images: true
  post_order: 'newest_first'

# Game proposals: harvests Steam links out of a chat channel and catalogues each
# game as a post in a forum channel. Requires a bot token (a webhook cannot read
# messages) with the Message Content intent enabled.
#
# IMPORTANT: adding this block means DISCORD_BOT_TOKEN must be set wherever the
# bot runs. loadConfig() throws on any unset ${VAR}, which would take the news
# feed down with it -- see .github/workflows/feed.yml.
#
# proposals:
#   enabled: true
#   bot_token: '${DISCORD_BOT_TOKEN}'
#   general_channel_id: '000000000000000000'  # channel to harvest links from
#   forum_channel_id: '000000000000000000'    # forum channel to post into
#   country_code: 'IE'                        # pins prices to one Steam region
#   language: 'english'
